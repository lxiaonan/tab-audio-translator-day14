<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Audio Translator</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <header>
        <span class="logo">TAT</span>
        <div>
          <p data-i18n="eyebrow">标签页音频翻译</p>
          <h1 data-i18n="title">实时字幕控制台</h1>
        </div>
        <button id="lang-toggle" class="icon" type="button">EN</button>
      </header>

      <section class="status-card" id="status-card">
        <span id="status-dot"></span>
        <div>
          <strong id="status-title">-</strong>
          <p id="status-text">-</p>
        </div>
      </section>

      <section class="controls">
        <label>
          <span data-i18n="bridgeUrl">本地桥接服务</span>
          <input id="bridge-url" type="url" value="http://127.0.0.1:8787" />
        </label>
        <label>
          <span data-i18n="sourceLang">源语言</span>
          <select id="source-lang">
            <option value="auto">Auto</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="zh">中文</option>
          </select>
        </label>
        <label>
          <span data-i18n="targetLang">目标语言</span>
          <select id="target-lang">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
        </label>
        <label>
          <span data-i18n="chunkSeconds">切片秒数</span>
          <input id="chunk-seconds" type="number" min="2" max="15" value="5" />
        </label>
      </section>

      <section class="button-row">
        <button id="start" type="button" data-i18n="start">开始翻译</button>
        <button id="stop" class="secondary" type="button" data-i18n="stop">停止</button>
      </section>

      <section class="caption-card">
        <p data-i18n="latestCaption">最新字幕</p>
        <strong id="latest-source">-</strong>
        <span id="latest-target">-</span>
      </section>

      <section class="links">
        <a href="../index.html" target="_blank" data-i18n="openGuide">打开使用说明</a>
        <button id="copy-log" type="button" class="ghost" data-i18n="copyLog">复制会话记录</button>
      </section>
    </main>
    <script src="./popup.js" type="module"></script>
  </body>
</html>
