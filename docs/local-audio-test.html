<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Audio Translator Local Test</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #f8fafc;
        background: radial-gradient(circle at 20% 20%, #2563eb, transparent 28rem), #0f172a;
        font-family: Inter, system-ui, sans-serif;
      }
      main {
        width: min(760px, calc(100vw - 32px));
        padding: 32px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.76);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 4rem);
        line-height: 1;
      }
      audio {
        width: 100%;
        margin-top: 24px;
      }
      button {
        min-height: 44px;
        border: 0;
        border-radius: 12px;
        padding: 0 18px;
        color: #0f172a;
        background: #93c5fd;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Local English Audio Test</h1>
      <p>This page plays a generated English speech sample for extension capture testing.</p>
      <button id="play" type="button">Play test audio</button>
      <audio id="audio" src="./asr-test.webm" controls loop></audio>
    </main>
    <script>
      document.querySelector("#play").addEventListener("click", async () => {
        await document.querySelector("#audio").play();
      });
    </script>
  </body>
</html>
